<a href="javascript:void(0)" (click)="onClick()" [ngClass]="{'clickable': isClickable}">
  <div class="border-blinder"></div>
  <div class="co-text">
    <h3 [innerHTML]="heading"></h3>
    <p [innerHTML]="body"></p>
  </div>
  <div class="co-metric">
    {{ metricValue | formatNumber }}
  </div>
</a>
