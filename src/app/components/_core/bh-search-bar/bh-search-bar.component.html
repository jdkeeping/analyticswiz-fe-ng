<div class="search-bar">
  <div class="search-bar-input">
    <ion-icon class="search-icon" name="search-outline"></ion-icon>
    <a
      href="javascript:void(0)"
      (click)="onClear()"
      class="close-icon"
      *ngIf="searchTerm"
    >
      <ion-icon name="close-outline"></ion-icon>
    </a>
    <input
      type="search"
      placeholder="{{ placeholderText | translate }}"
      (focus)="onFocus(true)"
      (blur)="onFocus(false)"
      [ngClass]="{ round: shape === 'round' }"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch()"
    />
    <div
      class="search-suggestions"
      [ngClass]="{ active: searchTerm }"
      *ngIf="showSuggestions && isFocused"
    >
      <div class="search-suggestions-padding" *ngIf="(isSearching || searchTerm)">
        <ion-spinner
          name="dots"
          color="primary"
          *ngIf="isSearching"
        ></ion-spinner>
        <ng-container *ngIf="!isSearching">
          <ng-content></ng-content>
        </ng-container>
        <span *ngIf="!isSearching && resultCount === 0">No results found.</span>
      </div>
    </div>
  </div>
  <ion-button (click)="onClick()" *ngIf="showSearchButton"
    >{{ "Search" | translate }}
  </ion-button>
</div>
