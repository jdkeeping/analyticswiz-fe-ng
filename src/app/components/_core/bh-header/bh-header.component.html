<div class="header" [ngClass]="{'fixed': fixed, 'search': showSearch}">
  <a
    href="javascript:void(0)"
    (click)="openHome()"
    analyticsClick
    eventName="header-logo-click"
    eventDetail="Home"
  >
    <bh-logo></bh-logo>
  </a>
  <div class="nav">
    <div class="nav-inner">
      <div class="nav-search" *ngIf="showSearch">
        <bh-search-bar [showSearchButton]="false" (searchEvent)="onSearch($event)"></bh-search-bar>
      </div>
      <ul class="desktop-only-flex">
        <li *ngFor="let p of pages">
          <a
            href="javascript:void(0)"
            (click)="openTab(p.navPath)"
            analyticsClick
            eventName="header-link"
            [eventDetail]="p.name"
            [ngClass]="{ active: activePage === p.tabId }"
            *ngIf="p.isAccessible"
            >{{ p.name | translate }}</a
          >
        </li>
      </ul>
    </div>
  </div>
  <div class="charms">
    <a
      href="javascript:void(0)"
      eventName="header-charm"
      eventDetail="user"
      (click)="openUserMenu()"
    >
      <bh-charm type="user" label="User Menu"></bh-charm>
    </a>
    <a
      href="javascript:void(0)"
      routerLink="/help"
      eventName="header-charm"
      eventDetail="help"
    >
      <bh-charm type="icon" ionIcon="help-circle-outline" label="Help">
      </bh-charm>
    </a>
  </div>
</div>
<div class="fixed-spacer" [ngClass]="{'search': showSearch}" *ngIf="fixed"></div>
