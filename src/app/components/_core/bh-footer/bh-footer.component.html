<div class="footer" [ngStyle]="{ 'margin-top': marginTop}">
  <a routerLink="/help" analyticsClick eventName="footer-link" eventDetail="get-help">Get Help</a>
  <a routerLink="/share" analyticsClick eventName="footer-link" eventDetail="share">Share this App</a>
  <a routerLink="/check-for-updates" analyticsClick eventName="footer-link" eventDetail="check-for-updates">Check for Updates</a>
  <a href="https://www.baystatehealth.org" target="_blank" analyticsClick eventName="footer-link" eventDetail="baystatehealth.org">BaystateHealth.org</a>
  <a href="https://www.baystatehealth.org/privacy-policy" target="_blank" analyticsClick eventName="footer-link" eventDetail="privacy">Privacy</a>
  <a href="https://www.baystatehealth.org/terms-of-use" target="_blank" analyticsClick eventName="footer-link" eventDetail="terms-of-use">Terms of Use</a>
  <div class="app-copyright">
    Copyright &#169; {{ year }} Baystate Health
  </div>
  <div class="bh-version">
    Version: {{ env?.appVersion }}-{{ env?.env }}
  </div>
</div>
