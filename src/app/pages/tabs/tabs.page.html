<ion-tabs>
  <ion-tab-bar slot="bottom" class="mobile-only-flex">
    <ng-container *ngFor="let p of pages">
      <ion-tab-button
        [tab]="p.tabId"
        [href]="p.navPath"
        analyticsClick
        eventName="tab-button"
        [eventDetail]="p.name"
        *ngIf="p.isAccessible"
      >
        <ion-icon aria-hidden="true" [name]="p.ionIcon"></ion-icon>
        <ion-label>{{ p.name }}</ion-label>
      </ion-tab-button>
    </ng-container>
  </ion-tab-bar>
</ion-tabs>
